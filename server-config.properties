# Packaged defaults; saved settings on a device take precedence.
# Public production endpoints should use wss:// for ASR and https:// for TTS.
recognizerUrl=wss://webcaptioner-spoz.mudrowak.de/
ttsUrl=https://bamborakapi.mudrowak.de/api/tts/
# Comma-separated language codes actually supported by the deployed recognition endpoint.
recognitionLanguages=hsb
# TTS request format: simple or bamborak. Bamborak requires a deployed speaker ID.
ttsProtocol=bamborak
ttsSpeakerId=korla
recognizerSampleRate=48000
continuousRecognition=true
