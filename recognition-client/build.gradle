plugins {
    id "com.android.application"
}

android {
    namespace "de.adrianzimmermann.speechclient"
    compileSdk 34

    defaultConfig {
        applicationId "de.adrianzimmermann.speechclient"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "junit:junit:4.13.2"
}
